# Maintain dependencies for GitHub Actions used in build.yml
# (suggested by chcg in notepad-plus-plus/nppPluginList#1272).
# See https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
